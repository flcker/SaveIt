<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SaveIt 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #f8fafc;
      padding: 32px;
      max-width: 640px;
      margin: 0 auto;
    }
    h1 { font-size: 24px; margin-bottom: 24px; }
    .section { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; border: 1px solid #e2e8f0; }
    .section h2 { font-size: 16px; margin-bottom: 12px; color: #334155; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; color: #64748b; margin-bottom: 4px; }
    .field input[type="number"], .field select {
      width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 4px; font-size: 14px;
    }
    .field-row { display: flex; align-items: center; gap: 8px; }
    .field-row label { margin-bottom: 0; }
    .checkbox-field { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .checkbox-field label { color: #1a1a1a; font-size: 14px; }
    button {
      padding: 10px 20px; border-radius: 6px; border: none;
      background: #2563eb; color: #fff; font-size: 14px; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .saved { color: #16a34a; font-size: 13px; margin-left: 12px; opacity: 0; transition: opacity 0.3s; }
    .saved.show { opacity: 1; }
  </style>
</head>
<body>
  <h1>SaveIt 设置</h1>

  <div class="section">
    <h2>页面捕获</h2>
    <div class="checkbox-field">
      <input type="checkbox" id="removeScripts" checked>
      <label for="removeScripts">移除 JavaScript 脚本</label>
    </div>
    <div class="checkbox-field">
      <input type="checkbox" id="removeHidden">
      <label for="removeHidden">移除隐藏元素</label>
    </div>
    <div class="checkbox-field">
      <input type="checkbox" id="compressHTML" checked>
      <label for="compressHTML">压缩 HTML</label>
    </div>
  </div>

  <div class="section">
    <h2>爬取设置</h2>
    <div class="field">
      <label for="pageDelay">页面间延迟（毫秒）</label>
      <input type="number" id="pageDelay" value="1500" min="500" max="10000" step="100">
    </div>
    <div class="field">
      <label for="maxPages">最大页面数</label>
      <input type="number" id="maxPages" value="500" min="1" max="2000">
    </div>
    <div class="field">
      <label for="maxDepth">最大导航深度</label>
      <input type="number" id="maxDepth" value="10" min="1" max="20">
    </div>
    <div class="checkbox-field">
      <input type="checkbox" id="respectRobots" checked>
      <label for="respectRobots">遵守 robots.txt</label>
    </div>
  </div>

  <div class="section">
    <h2>输出设置</h2>
    <div class="field">
      <label for="outputMode">输出格式</label>
      <select id="outputMode">
        <option value="single-merged">单个合并 HTML</option>
        <option value="zip">ZIP 压缩包</option>
      </select>
    </div>
    <div class="field">
      <label for="filenameTemplate">文件名模板</label>
      <input type="text" id="filenameTemplate" value="{site}-{date}" style="width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:4px;font-size:14px;">
      <div style="font-size:11px;color:#94a3b8;margin-top:4px;">可用变量：{site}, {date}, {title}</div>
    </div>
  </div>

  <div style="display:flex;align-items:center;">
    <button id="save">保存设置</button>
    <span class="saved" id="savedMsg">已保存 ✓</span>
  </div>

  <script type="module" src="./options.ts"></script>
</body>
</html>
